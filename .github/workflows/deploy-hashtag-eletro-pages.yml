name: Deploy Hashtag Eletro dashboard

on:
  push:
    branches:
      - main
    paths:
      - "hashtag-eletro/**"
      - ".github/workflows/deploy-hashtag-eletro-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /hashtag-eletro/
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: hashtag-eletro/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
